 chips(list);
 if(brand)list=list.filter(function(p){return p.b==brand});
 var o=$("ord").value;
 list.sort(function(a,b){return o=="a"?a.u-b.u:o=="d"?b.u-a.u:a.d.localeCompare(b.d)});
 $("cnt").textContent=list.length+" producto"+(list.length==1?"":"s");

 var sp=list.map(function(p){return p.u}).sort(function(a,b){return a-b});
 var LB=["Más barato","Barato","Precio medio","Caro","Más caro"];
 $("res").innerHTML=list.slice(0,300).map(function(p){

  return '<div class="it'+(sel==p.c?" sel":"")+'" data-c="'+esc(p.c)+'"><div class="in"><div class="d">'+hl(p.d,ws)+'</div><div class="m">'+esc(p.b)+' · Serie/código: '+hl(p.c,ws)+'</div></div><div class="p">'+tag+'<div><div class="u">'+money(p.u,"$")+'</div><div class="q">'+money(p.l,"Q")+'</div></div></div></div>'}).join("");
